<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starlink | Visão por Localidade</title>
<style>
:root{--bg:#0b1217;--panel:#15232c;--panel2:#1b2c36;--line:#28414d;--text:#eef8fa;--muted:#91abb6;--teal:#22cbd4;--green:#52d18a;--yellow:#f4cf59;--orange:#ff9958;--red:#ff676d;--shadow:0 18px 45px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 10%,rgba(34,203,212,.09),transparent 30%),linear-gradient(145deg,#081015,#101b22 58%,#091116);font-family:Segoe UI,Inter,Arial,sans-serif;color:var(--text)}
a{color:inherit;text-decoration:none}.shell{max-width:1650px;margin:auto;padding:30px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:18px}.logo{max-height:48px;max-width:170px;object-fit:contain}.brand h1{font-size:28px;margin:0}.brand p{color:var(--muted);margin:6px 0 0;font-size:14px}.refresh{border:1px solid var(--line);background:#152630;color:var(--text);border-radius:11px;padding:10px 16px;cursor:pointer}.refresh:hover{border-color:#3f6777}.hero{border:1px solid #284750;background:linear-gradient(120deg,rgba(34,203,212,.11),rgba(18,37,47,.72));border-radius:19px;padding:22px 24px;display:grid;grid-template-columns:1.5fr repeat(3,minmax(150px,.55fr));gap:16px;align-items:center;box-shadow:var(--shadow);margin-bottom:20px}.hero h2{font-size:19px;margin:0 0 5px}.hero .sub{color:var(--muted);font-size:13px}.metric{border-left:1px solid #2d4a56;padding-left:18px}.metric .l{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#8ba8b4;font-weight:800}.metric .v{font-size:25px;font-weight:800;margin-top:6px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:26px 2px 14px}.section-head h2{margin:0;font-size:17px}.section-head span{font-size:12px;color:var(--muted)}.locations{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:16px}.loc{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow);transition:.18s transform,.18s border-color}.loc:hover{transform:translateY(-3px);border-color:#3f7080}.loc::after{content:"";position:absolute;right:-30px;top:-36px;width:120px;height:120px;border-radius:50%;background:rgba(34,203,212,.06)}.loc-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.loc-name{font-size:20px;font-weight:800}.status{font-size:9px;font-weight:900;border-radius:999px;padding:5px 9px}.normal{background:rgba(82,209,138,.15);color:#78e6aa}.atencao{background:rgba(244,207,89,.16);color:#ffe584}.critico{background:rgba(255,153,88,.16);color:#ffb77f}.emergencia{background:rgba(255,103,109,.16);color:#ff9498}.big{font-size:29px;font-weight:820;margin-top:20px}.big small{font-size:12px;color:var(--muted);font-weight:500}.progress{height:9px;border-radius:99px;background:#09141a;border:1px solid #233a45;overflow:hidden;margin:13px 0 15px}.fill{height:100%;background:linear-gradient(90deg,#1db0ba,#61edf2);min-width:2px}.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:rgba(5,17,23,.28);border:1px solid #263b45;border-radius:11px;padding:10px}.mini .l{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.mini .v{font-size:14px;font-weight:700;margin-top:4px}.open{margin-top:15px;color:#7fe8ed;font-size:12px;font-weight:800;display:flex;justify-content:space-between}.empty{text-align:center;color:var(--muted);padding:80px 20px;border:1px dashed #29414b;border-radius:16px}.footer{color:#708994;font-size:11px;margin-top:20px;display:flex;justify-content:space-between}.dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:6px}
@media(max-width:1200px){.locations{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr 1fr}}@media(max-width:700px){.shell{padding:18px}.top{align-items:flex-start;flex-direction:column}.locations{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.metric{border-left:0;border-top:1px solid #2d4a56;padding:12px 0 0}}
</style>
</head>
<body><main class="shell">
<div class="top"><div class="brand"><img class="logo" src="/logo.png" onerror="this.style.display='none'" alt=""><div><h1>Starlink Consumption</h1><p>Visão executiva por localidade</p></div></div><button id="refresh" class="refresh">Atualizar</button></div>
<section class="hero"><div><h2>Consumo atual da operação</h2><div id="period" class="sub">Carregando dados...</div></div><div class="metric"><div class="l">Consumo total</div><div id="totalUsage" class="v">-</div></div><div class="metric"><div class="l">Franquia total</div><div id="totalQuota" class="v">-</div></div><div class="metric"><div class="l">Unidades monitoradas</div><div id="unitsCount" class="v">-</div></div></section>
<div class="section-head"><h2>Localidades</h2><span>Clique em uma unidade para abrir seu dashboard</span></div>
<section id="locations" class="locations"></section>
<div class="footer"><span><span class="dot"></span>Dados Compass + histórico local</span><span id="updated">-</span></div>
</main>
<script>
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gb=v=>{v=Number(v||0);return v>=1000?(v/1000).toFixed(2)+' TB':v.toFixed(0)+' GB'}; const pct=v=>Number(v||0).toFixed(1)+'%';
const dateBR=v=>{if(!v)return '-';let s=String(v).slice(0,10).split('-');return s.length===3?`${s[2]}/${s[1]}/${s[0]}`:v};
const dtBR=v=>{try{return new Date(v).toLocaleString('pt-BR')}catch{return v||'-'}}; const slug=v=>String(v||'normal').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
async function load(){ $('refresh').disabled=true; try{let r=await fetch('/api/dashboard?days=7',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();render(d)}catch(e){$('locations').innerHTML=`<div class="empty">Não foi possível carregar o painel: ${esc(e.message)}</div>`}finally{$('refresh').disabled=false}}
function render(d){let s=d.summary||{};$('totalUsage').textContent=gb(s.total_usage_gb);$('totalQuota').textContent=gb(s.total_quota_gb);$('unitsCount').textContent=s.units||0;$('period').textContent=s.period_start&&s.period_end?`Ciclo apresentado: ${dateBR(s.period_start)} a ${dateBR(s.period_end)}`:'Período do Compass não disponível';$('updated').textContent='Atualizado: '+dtBR(d.generated_at);
let us=d.units||[];$('locations').innerHTML=us.length?us.map(u=>`<a class="loc" href="/unidade/${encodeURIComponent(u.unit)}"><div class="loc-top"><div class="loc-name">${esc(u.unit)}</div><span class="status ${slug(u.status)}">${esc(u.status||'-')}</span></div><div class="big">${gb(u.total_gb)} <small>de ${gb(u.quota_gb)}</small></div><div class="progress"><div class="fill" style="width:${Math.min(Number(u.usage_pct||0),100)}%"></div></div><div class="loc-grid"><div class="mini"><div class="l">Utilização</div><div class="v">${pct(u.usage_pct)}</div></div><div class="mini"><div class="l">Média diária</div><div class="v">${u.rate_gb_day==null?'--':Number(u.rate_gb_day).toFixed(1)+' GB'}</div></div><div class="mini"><div class="l">Risco</div><div class="v">${esc(u.forecast_risk||'-')}</div></div><div class="mini"><div class="l">Saldo</div><div class="v">${gb(u.remaining_gb)}</div></div></div><div class="open"><span>Abrir dashboard da unidade</span><span>→</span></div></a>`).join(''):'<div class="empty">Nenhuma unidade encontrada no SQLite.</div>'}
$('refresh').addEventListener('click',load); load(); setInterval(load,60000);
</script></body></html>
